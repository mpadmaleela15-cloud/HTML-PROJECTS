 </header>
 <hr>
 <main>
    <form>
        <table>
            <caption><h1>Doctor Resigration Form </h1></caption>
            <tr>
                <td><label for="1">Name:</label></td>
                <td><input type="text" id="1" placeholder="Enter Name"></td>
            </tr>
            <tr>
                <td><label for="2">Password:</label></td>
                <td><input type="password" id="2" placeholder="Enter password"></td>
            </tr>
            <tr>
                <td><label for="3">Email:</label></td>
                <td><input type="email" id="3" placeholder="Enter Email"></td>
            </tr>
            <tr>
                <td><label for="4">Phone NUmber:</label></td>
                <td><input type="number" id="4" placeholder="Enter PH"></td>
            </tr>
            <tr>
                <td>
                    <label>Specialization:</label>
                </td>
                <td>
                    <select>
                        <option value="Neurology" >Neurology</option>
                        <option value="Neurosurgery">Neurosurgery</option>
                        <option value="cardiologist">cardiologist</option>
                        <option value="dermatologist">dermatologist</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="6">Experience (years):</label></td>
                <td><input type="number" id="6" placeholder="Enter Experience"></td>
            </tr>
            <tr>
                <td><label>Geneder:</label></td>
                <td><input type="radio" value="male" name="gender" >Male</td>
                <td><input type="radio" value="female" name="gender">Female</td>
            </tr>
            <tr>
                <td><label >Available Days:</label></td>
                <td><input type="checkbox" value="monday">Mon</td>
                <td><input type="checkbox" value="thu">THU</td>
                <td><input type="checkbox" value="thur">Thur</td>
            </tr>
            <tr>
                <td><label for="9">Available Time</label></td>
                <td><input type="time" id="9"></td>
            </tr>
            <tr>
                <td><label for="10">Address:</label></td>
                <td><textarea cols="4" row="4" id="10"></textarea></td>
            </tr>
            <tr>
                <td><label>Upload Certificate:</label></td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td><input type="submit"></td>
                <td><input type="reset"></td>
            </tr>
        </table>
    </form>
    </main>

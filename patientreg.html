<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doctor registation form</title>
</head>
<body>
    <header><h1>patient registation form</h1></header>
    <form >
        <table>
            <tr>
                <td>
                    <label><b> full name:</b></label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
        
        
        
            <tr>
                <td>
                   <label><b> password:</b></label> 
                </td>
                <td>
                    <input type="password">

                </td>
            </tr>
        
        

            <tr>
                <td>
                    <label><b> email</b></label>
                </td>
                <td>
                    <input type="email"> 
                </td>
            </tr>
        
        
        
            <tr>
                <td>
                   <label><b> phone number</b></label> 
                </td>
                <td>
                    <input type="number"> 
                </td>
            </tr>
            <tr>
                <td>
                    <label>date of birth</label>
                </td>
                <td>
                    <input type="date">
                </td>
            </tr>
            <tr>
                <td>
                   <label><b>Appointment data & time</label> 
                </td>
                <td>
                    <input type="datetime-local">
                </td>
                
            </tr>
        
        
            <tr>
                <td>
                   <label><b>select gender</b></label> 
                </td>
                <td>
                    <input type="radio" value="female"> female
                    <input type="radio" value="male"> male
                    <input type="radio" value="other"> other
                </td>
            </tr>
        
        
            <tr>
                <td>
                  <label > <b>diseases:</b></label>  
                </td>
                <td>
                    <input type="checkbox"value="diabetes"> diabetes
                    <input type="checkbox" value="bp"> bp
                    <input type="checkbox" value="heart problem"> heart problem
                </td>
            </tr>
        
            <tr>
                <td>
                    <label ><b>blood group</b></label>
                </td>
                <td>
                   <select >
                    <option value="a+">a+</option>
                    <option value="a">a</option>
                    <option value="b+"></option>
                    <option value="b"></option>
                   </select>
                </td>
            </tr>
        
        
            <tr>
                <td>
                   <label ><b>address</b></label> 
                </td>
                <td>
                   <textarea rows="10" cols="5"></textarea> 
                </td>
            </tr>
        
        
            <tr>
                <td>
                    <label>upload file</label> 
                </td>
                <td>
                    <input type="file">
                </td>
            </tr>
            
        
      <td><input type="submit" value="register"></td>
       <td><input type="reset" value="clear"></td>
        </table>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doctor registation form</title>
</head>
<body>
    <header><h1>doctor registation form</h1></header>
    <form >
        <table>
            <tr>
                <td>
                    <label><b> full name:</b></label>
                </td>
                <td>
                    <input type="text">
                </td>
            </tr>
        
        
        
            <tr>
                <td>
                   <label><b> password:</b></label> 
                </td>
                <td>
                    <input type="password">

                </td>
            </tr>
        
        

            <tr>
                <td>
                    <label><b> email</b></label>
                </td>
                <td>
                    <input type="email"> 
                </td>
            </tr>
        
        
        
            <tr>
                <td>
                   <label><b> phone number</b></label> 
                </td>
                <td>
                    <input type="number"> 
                </td>
            </tr>
        
        
            <tr>
                <td>
                    <label><b> specialization</b></label>  
                </td>
                <td>
                   <select>
                    <option value="cardiologist"> cardiologist</option>
                    <option value="orthoprdic"> orthoprdic</option>
                    <option value="dentist"> dentist</option>
                   </select>
                
                </td>
            </tr>
        
        
            <tr>
                <td>
                   <label><b>experience</label> 
                </td>
                <td>
                    <input type="number"> 
                </td>
            </tr>
        
        
            <tr>
                <td>
                   <label><b>select gender</b></label> 
                </td>
                <td>
                    <input type="radio" value="female"> female
                    <input type="radio" value="male"> male
                    <input type="radio" value="other"> other
                </td>
            </tr>
        
        
            <tr>
                <td>
                  <label > <b>available days</b></label>  
                </td>
                <td>
                    <input type="checkbox"value="monday"> monday
                    <input type="checkbox" value="tuesday"> tuesday
                    <input type="checkbox" value="wednesday"> wednesday
                </td>
            </tr>
        
            <tr>
                <td>
                    <label ><b>available time</b></label>
                </td>
                <td>
                   <input type="time"> 
                </td>
            </tr>
        
        
            <tr>
                <td>
                   <label ><b>address</b></label> 
                </td>
                <td>
                   <textarea rows="10" cols="5"></textarea> 
                </td>
            </tr>
        
        
            <tr>
                <td>
                    <label>upload file</label> 
                </td>
                <td>
                    <input type="file">
                </td>
            </tr>
            
        
      <td><input type="submit"></td>
       <td><input type="reset"></td>
        </table>
    </form>
</body>
</html>

<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>patient Registration</title>
</head>

<body>
    <header>
        <h1>
            <center>
                <font color="green">360 </font>
                <font color="blue">practo</font>
            </center>
        </h1>
        <center>
            <nav align="center">
                <u><a href="index.html"></a> </u> &nbsp;
                <u><a href="doctors.html">Doctor</a> </u> | &nbsp;
                <u><a href="fb.html">Feedback</a> </u> | &nbsp;

                <u><a href="Doctor Login.html">Doctor Login</a> </u> | &nbsp;
                <u><a href="#">Patient Reg</a> </u> | &nbsp;
                <u><a href="Patient Login.html">Patient Login</a> </u> | &nbsp;
            </nav>
        </center>
    </header>
    <hr>
    <main>
        <form action="https://padmaleela/.com" method="get">
            <table>
                <caption>
                    <h1>patient Resigration Form </h1>
                </caption>
                <tr>
                    <td><label for="1">Name:</label></td>
                    <td><input type="text" id="1" placeholder="Enter Name" required></td>
                </tr>
                <tr>
                    <td><label for="6">Password:</label></td>
                    <td><input type="password" id="6" placeholder="Enter password" required></td>
                </tr>
                <tr>
                    <td><label for="2">Email:</label></td>
                    <td><input type="email" id="2" placeholder="Enter Email" required></td>
                </tr>
                <tr>
                    <td><label for="3">Phone NUmber:</label></td>
                    <td><input type="number" id="3" placeholder="Enter Phone Nmuber" required></td>
                </tr>
                <tr>
                    <td><label for="4">Date of Birth:</label></td>
                    <td><input type="date" id="4" placeholder="Enter DOB" required></td>
                </tr>
                <tr>
                    <td><label for="5">Appointment Date & Time:</label></td>
                    <td><input type="datetime-local" id="5" required></td>
                </tr>

                <tr>
                    <td><label for=>Geneder:</label></td>
                    <td><input type="radio" value="male" name="gender">Male</td>
                    <td><input type="radio" value="female" name="gender">Female</td>
                </tr>
                <tr>
                    <td><label>Diseases:</label></td>
                    <td><input type="checkbox" value="Diabetes">Diabetes</td>
                    <td><input type="checkbox" value="BP">BP</td>
                    <td><input type="checkbox" value="Heart promblem">Heart promblem</td>
                </tr>
                <tr>
                    <td><label>Blood group:</label></td>
                    <td><select name="blood group">
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>

                        </select></td>
                </tr>
                <tr>
                <tr>
                    <td><label>Address:</label></td>
                    <td><textarea cols="4" row="4"></textarea></td>
                </tr>
                <tr>
                    <td><label>Upload Report:</label></td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td><input type="submit" value="Register"></td>
                    <td><input type="reset" value="Clear"></td>
                </tr>
            </table>
        </form>
    </main>
    <br><br><br><br><br><br><br><br>
    <hr>
    <footer>
        <center>
            <font size="3px" color="blue">copy@padmaleela</font>
        </center>
    </footer>
</body>

</html>
